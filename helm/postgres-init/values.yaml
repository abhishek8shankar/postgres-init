# Default values for postgres-init.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: mosipqa/postgres-init
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: develop

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

jobAnnotations: {}

jobSecurityContext: {}
# fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths: []
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
#   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

## Some common set of users are created across all postgres servers with same password.
dbUserPasswords:
  dbuserPassword: ""

## Per-database configuration:
##
## enabled:        Set to true to run the init job for this database.
## scriptsDir:     Folder name inside db_scripts/ in the git repo. MUST match the repo
##                 structure exactly (e.g. mosip_master). Do NOT change this unless the
##                 repo folder is renamed.
## dbName:         Actual Postgres database name to create. Can be anything
##                 (e.g. mosip_master, mosip_master02). This is what gets created in Postgres.
## dbUser:         The DB user created/used by deploy.sh (DB_UNAME). Can be any name
##                 (e.g. masteruser, masteruser02).
## defaultDb:      Default postgres DB to connect to before creating the target DB.
## host:           In-cluster service name of postgres.
## port:           Postgres port (default 5432).
## su.user:        Postgres superuser name (default: postgres).
## su.secret.name: K8s secret name holding the superuser password.
## su.secret.key:  Key inside the secret for the superuser password.
## dml:            Whether DML scripts should be loaded: 0 (skip) or 1 (load).
## repoUrl:        Git repo URL containing the db_scripts/ folder.
## branch:         Git branch to clone from.

databases:
  mosip_master:
    enabled: false
    scriptsDir: mosip_master      # fixed - must match db_scripts/ folder in repo
    dbName: mosip_master          # customize e.g. mosip_master02
    dbUser: masteruser            # customize e.g. masteruser02
    defaultDb: postgres
    host: "postgres-postgresql"
    port: 5432
    su:
      user: postgres
      secret:
        name: postgres-postgresql
        key: postgres-password
    dml: 1
    repoUrl: https://github.com/mosip/admin-services.git
    branch: develop

